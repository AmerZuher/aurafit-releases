name: Suggest an idea
description: Something AuraFit could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like AuraFit to do, and how would it help you?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you manage today?
      description: Optional. What you do now without it.
