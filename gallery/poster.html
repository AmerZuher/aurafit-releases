<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraFit - Food Diary, Workouts & Body Progress</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
        }

        .poster {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a52 50%, #0d2438 100%);
            background-attachment: fixed;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .poster::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(74, 188, 226, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            animation: float 6s ease-in-out infinite;
        }

        .poster::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .content {
            color: white;
            z-index: 3;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
            animation: slideInLeft 0.8s ease-out;
        }

        .logo-section svg {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 4px 12px rgba(74, 188, 226, 0.3));
        }

        .tagline-small {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #4abce2;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 56px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #b0d4e3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideInLeft 0.8s ease-out 0.1s backwards;
        }

        .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #4abce2 0%, #0a9fd9 100%);
            margin: 24px 0;
            border-radius: 2px;
            animation: slideInLeft 0.8s ease-out 0.2s backwards;
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.6;
            color: #b0d4e3;
            margin-bottom: 30px;
            animation: slideInLeft 0.8s ease-out 0.3s backwards;
        }

        .feature-tags {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            animation: slideInLeft 0.8s ease-out 0.4s backwards;
        }

        .tag {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #4abce2;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 16px;
            background: rgba(74, 188, 226, 0.1);
            border: 1px solid rgba(74, 188, 226, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(74, 188, 226, 0.2);
            border-color: rgba(74, 188, 226, 0.6);
            transform: translateY(-2px);
        }

        .cta-button {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #4abce2 0%, #0a9fd9 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(74, 188, 226, 0.3);
            animation: slideInLeft 0.8s ease-out 0.5s backwards;
        }

        .cta-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(74, 188, 226, 0.4);
        }

        .cta-button:active {
            transform: translateY(-2px);
        }

        .mockups {
            position: relative;
            height: 500px;
            animation: slideInRight 0.8s ease-out;
        }

        .mockup {
            position: absolute;
            width: 240px;
            height: 480px;
            background: linear-gradient(135deg, #1a3a52 0%, #0a1628 100%);
            border: 12px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
        }

        .mockup:nth-child(1) {
            left: 0;
            top: 20px;
            z-index: 3;
            animation: float 4s ease-in-out infinite;
        }

        .mockup:nth-child(2) {
            right: 0;
            top: 0;
            z-index: 2;
            opacity: 0.9;
            animation: float 5s ease-in-out infinite 0.2s;
        }

        .mockup:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(74, 188, 226, 0.2);
        }

        .mockup-content {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a3a52 0%, #0a2438 100%);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .mockup-content p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.4;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .stat-icon {
            width: 20px;
            height: 20px;
            background: #4abce2;
            border-radius: 50%;
            opacity: 0.8;
        }

        .stat-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            h1 {
                font-size: 42px;
            }

            .mockups {
                height: 400px;
            }

            .mockup {
                width: 200px;
                height: 400px;
            }
        }

        @media (max-width: 640px) {
            .poster {
                padding: 20px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 16px;
            }

            .feature-tags {
                flex-direction: column;
                gap: 10px;
            }

            .tag {
                width: 100%;
                justify-content: center;
            }

            .mockups {
                display: none;
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="container">
            <div class="content">
                <div class="logo-section">
                    <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="64" cy="64" r="60" fill="rgba(74, 188, 226, 0.1)" stroke="#4abce2" stroke-width="1"/>
                        <g filter="drop-shadow(0 2px 4px rgba(74, 188, 226, 0.3))">
                            <path d="M64 30 Q75 45 75 60 Q75 75 64 85 Q53 75 53 60 Q53 45 64 30" fill="#4abce2"/>
                            <circle cx="64" cy="48" r="6" fill="#0a1628"/>
                        </g>
                    </svg>
                    <span class="tagline-small">For Android. Offline.</span>
                </div>

                <h1>Food diary,<br>workouts<br>and body<br>progress</h1>

                <div class="divider"></div>

                <p class="subtitle">in one calm app</p>

                <div class="feature-tags">
                    <span class="tag">📊 Diary</span>
                    <span class="tag">💪 Workouts</span>
                    <span class="tag">📈 Body</span>
                </div>

                <button class="cta-button">Download Now</button>
            </div>

            <div class="mockups">
                <div class="mockup">
                    <div class="mockup-content">
                        <div>
                            <p style="font-weight: 600; color: rgba(255,255,255,0.9); margin-bottom: 12px;">Daily Goal</p>
                            <div style="margin-bottom: 16px;">
                                <div style="width: 60px; height: 60px; background: conic-gradient(#4abce2 60%, rgba(74,188,226,0.2) 60%); border-radius: 50%; margin: 0 auto;"></div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-icon"></div>
                                <span class="stat-label">1,462 / 2,300 kcal</span>
                            </div>
                        </div>
                        <div>
                            <p style="font-size: 10px; color: rgba(255,255,255,0.5);">Updates tracked in real-time</p>
                        </div>
                    </div>
                </div>

                <div class="mockup">
                    <div class="mockup-content">
                        <div>
                            <p style="font-weight: 600; color: rgba(255,255,255,0.9); margin-bottom: 12px;">Insights</p>
                            <div class="stat-item">
                                <div class="stat-icon"></div>
                                <span class="stat-label">6 of 7 days logged</span>
                            </div>
                            <div class="stat-item">
                                <div class="stat-icon"></div>
                                <span class="stat-label">Protein: 164g avg</span>
                            </div>
                        </div>
                        <div>
                            <p style="font-size: 10px; color: rgba(255,255,255,0.5);">Week vs week comparison</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
